# Publishes the browser version to Firebase Hosting (https://dreadhollow-b49c7.web.app).
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key from
# Firebase console → Project settings → Service accounts → Generate new private key.
name: Deploy web version
on:
  push:
    branches: [dreadhollow]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/check-i18n.js
      - run: node tools/build-www.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dreadhollow-b49c7
          channelId: live
  # The game's server: Firestore rules (profiles, leaderboards) and Cloud Functions (functions/). A separate job that
  # may fail without holding the web version back. The service account needs (Google Cloud → IAM): Firebase Rules
  # Admin, Cloud Functions Admin, Service Account User, and the project on the Blaze plan.
  backend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix functions
      - run: node tools/build-functions.js && node functions/test/engine.js
      - name: Deploy rules and functions
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules,functions --project dreadhollow-b49c7 --non-interactive --force
