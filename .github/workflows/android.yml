# Builds the Android app. Run it from GitHub → Actions → "Android app" → Run workflow, and pick:
#   debug    an APK to install on a test phone (test ads, the fixed debug key in android/app/debug.keystore)
#   release  the AAB for Google Play, signed with the upload key (real ads)
# The file to download is under the run's "Artifacts".
# Repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON      the content of google-services.json (Firebase console → Project settings → the Android
#                             app), unless the file is committed at android/app/google-services.json
#   ANDROID_KEYSTORE_BASE64   the upload key (.jks) in base64            ┐
#   ANDROID_KEYSTORE_PASSWORD its password                               │ release only
#   ANDROID_KEY_ALIAS         the key's alias (e.g. upload)              │
#   ANDROID_KEY_PASSWORD      the key's password (often the same)        │
#   ADMOB_APP_ID              the AdMob app id (ca-app-pub-…~…)          ┘ without it: the game's own (android/app/build.gradle)
name: Android app
on:
  workflow_dispatch:
    inputs:
      kind:
        description: debug (APK for a test phone) or release (AAB for Google Play)
        type: choice
        options: [debug, release]
        default: debug
      check_only:
        description: only check that the app builds (a stand-in google-services.json; Google sign-in will not work)
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node tools/check-i18n.js
      - name: google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f android/app/google-services.json ]; then echo "using the committed google-services.json"; exit 0; fi
          if [ "${{ inputs.check_only }}" = "true" ] && [ -z "$GS" ]; then cp tools/google-services.stand-in.json android/app/google-services.json; echo "::warning::stand-in google-services.json: Google sign-in will not work in this build"; exit 0; fi
          if [ -z "$GS" ]; then echo "::error::google-services.json is missing: add the secret GOOGLE_SERVICES_JSON (or commit android/app/google-services.json)"; exit 1; fi
          printf '%s' "$GS" > android/app/google-services.json
          grep -q '"com.dreadhollow.game"' android/app/google-services.json || { echo "::error::google-services.json is not for the package com.dreadhollow.game"; exit 1; }
      - name: Upload key
        if: inputs.kind == 'release'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::the release needs the upload key: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD"; exit 1; fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "DH_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Game files into the app
        run: DH_BUILD=${{ inputs.kind }} node tools/build-www.js && npx cap sync android
      - name: Build
        working-directory: android
        env:
          DH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DH_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.kind }}" = "release" ]; then ./gradlew bundleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi
      - name: Name the file after the version
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          if [ "${{ inputs.kind }}" = "release" ]; then cp android/app/build/outputs/bundle/release/app-release.aab "out/dreadhollow-$V.aab"
          else cp android/app/build/outputs/apk/debug/app-debug.apk "out/dreadhollow-$V-test.apk"; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: dreadhollow-${{ inputs.kind }}
          path: out/*
          retention-days: 30
