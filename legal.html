<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a070d">
  <title>Dreadhollow · Terms and Privacy</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Cinzel'; src: url('assets/fonts/cinzel-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
    @font-face { font-family: 'Alegreya Sans'; src: url('assets/fonts/alegreya-sans-latin-500-normal.woff2') format('woff2'); font-weight: 500; unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: 'Alegreya Sans'; src: url('assets/fonts/alegreya-sans-cyrillic-500-normal.woff2') format('woff2'); font-weight: 500; unicode-range: U+0400-045F; }
    @font-face { font-family: 'Alegreya Sans'; src: url('assets/fonts/alegreya-sans-latin-800-normal.woff2') format('woff2'); font-weight: 800; unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: 'Alegreya Sans'; src: url('assets/fonts/alegreya-sans-cyrillic-800-normal.woff2') format('woff2'); font-weight: 800; unicode-range: U+0400-045F; }
    :root { --bg: #0b080d; --panel: #150f18; --text: #e6dac2; --muted: #a8998a; --gold: #f0c860; --line: rgba(200,144,44,.35); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 500 16px/1.55 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif; }
    body { padding: 0 16px 40px; }
    main { max-width: 760px; margin: 0 auto; }
    header { position: sticky; top: 0; z-index: 2; background: linear-gradient(180deg, var(--bg) 80%, transparent); padding: 14px 0 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .brand { font: 700 18px 'Cinzel', Georgia, serif; color: var(--gold); letter-spacing: .06em; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    nav button { font: 800 13px 'Alegreya Sans', sans-serif; color: var(--text); background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; cursor: pointer; }
    nav button.on { color: #2a1604; background: linear-gradient(180deg, #ffe39a, #d9a13c); border-color: #d9a13c; }
    h1 { font: 700 26px 'Cinzel', Georgia, serif; color: var(--gold); margin: 10px 0 2px; letter-spacing: .03em; }
    .meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 14px; margin: 4px 0 18px; padding: 8px 12px; border-left: 3px solid var(--gold); background: var(--panel); }
    .meta b { color: var(--text); }
    .box { margin: 12px 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold); line-height: 1.6; }
    .brand { text-decoration: none; font-size: 15px; }
    @media print {
      :root { --bg: #fff; --panel: #f6f2ea; --text: #222; --muted: #555; --gold: #7a5214; --line: #cbb68a; }
      header { display: none; } body { padding: 0; } a { color: #222; }
    }
    h2 { font: 800 18px 'Alegreya Sans', sans-serif; color: var(--gold); margin: 26px 0 6px; }
    p, li { margin: 6px 0; }
    ul { padding-left: 22px; }
    a { color: var(--gold); }
    .todo { color: #ff8a70; font-style: italic; }
    body.embed header { display: none; }
    body.embed { padding-top: 4px; }
    body.embed h1 { display: none; }
  </style>
</head>
<body>
<main>
  <header><a id="back" class="brand" href="index.html"></a><nav id="nav"></nav></header>
  <article id="doc"></article>
</main>
<script src="js/data/legal.js"></script>
<script>
(function () {
  'use strict';
  var L = window.DH.legal, q = new URLSearchParams(location.search);
  var state = { doc: q.get('doc') === 'terms' ? 'terms' : 'privacy', lang: q.get('lang') === 'bg' ? 'bg' : (q.get('lang') ? 'en' : ((navigator.language || '').slice(0, 2) === 'bg' ? 'bg' : 'en')) };
  if (q.get('embed')) document.body.classList.add('embed');

  var pick = function (v, lang) { return v && typeof v === 'object' ? v[lang] || v.en : v; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var fill = function (lang) {
    var todo = function (en, bg) { return '<span class="todo">' + (lang === 'bg' ? bg : en) + '</span>'; };
    return {
      owner: pick(L.owner, lang) ? esc(pick(L.owner, lang)) + (L.eik ? (lang === 'bg' ? ', ЕИК ' : ', UIC ') + esc(L.eik) : '') + (pick(L.address, lang) ? (lang === 'bg' ? ', със седалище и адрес на управление ' : ', with its registered office at ') + esc(pick(L.address, lang)) : '')
        : todo('the developer of Dreadhollow (name to be added)', 'разработчикът на Dreadhollow (името предстои да бъде добавено)'),
      name: pick(L.owner, lang) ? esc(pick(L.owner, lang)) : todo('(name to be added)', '(името предстои да бъде добавено)'),
      eik: L.eik ? esc(L.eik) : '', addr: pick(L.address, lang) ? esc(pick(L.address, lang)) : '',
      email: L.email ? '<a href="mailto:' + esc(L.email) + '">' + esc(L.email) + '</a>' : todo('(address to be added)', '(адресът предстои да бъде добавен)'),
      date: new Date(L.updated + 'T12:00:00').toLocaleDateString(lang === 'bg' ? 'bg-BG' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }),
    };
  };

  /* The documents. Keep them true to what the game does: update them whenever sign-in, the cloud save,
   * advertising, purchases or any other data flow changes. */
  var DOCS = {
    en: {
      privacy: { title: 'Privacy Policy', body: function (f) { return [
        '<p>This Privacy Policy applies to the game <b>Dreadhollow</b> (the "Game"), in its mobile app and browser versions, developed and published by ' + f.owner + ' ("we", "us", "our"). It explains what information is processed when you play, how it is used, which third-party services are involved, and what your rights are. We are the controller of your personal data.</p>',
        '<h2>1. Accounts and player data</h2><p>Dreadhollow can be played without an account. Signing in is optional and serves one purpose: keeping your progress in the cloud so you can restore it or continue on another device.</p><ul>' +
          '<li><b>Guest play:</b> your progress, settings and purchases are kept on your device (in the app\'s storage or your browser\'s local storage). When the game\'s server is in use, each guest also gets an anonymous account (Firebase Authentication, without any name, email or contact details) and the progress is kept on the game\'s server under it, so that currencies and rewards can be checked there and nobody can cheat them. Signing in with Google or email later keeps that same progress.</li>' +
          '<li><b>Authentication:</b> if you sign in, Firebase Authentication (Google) processes your email address and, if you use Google Sign-In, your Google account identifier and the name linked to it, whether your email is verified, and the sign-in methods you use.</li>' +
          '<li><b>Cloud save:</b> for signed-in players, your save is stored in Google Cloud Firestore. It contains game data such as your level, heroes, equipment, in-game currencies, unlocked items, deeds, statistics and settings, a short summary of your progress, the kind of device it came from (for example "Android · app") and the times it was saved.</li>' +
          '<li><b>Locally stored data:</b> the Game keeps its save and settings on your device, and the browser version keeps an offline copy of the game files.</li></ul>',
        '<h2>2. Leaderboards; no multiplayer or chat</h2><p>Dreadhollow is a single-player game with no multiplayer and no chat or other communication between players.</p><p>The Game may run public leaderboards (for example, the most foes slain in one fight this month). Only signed-in players take part. For each leaderboard your score is stored in Google Cloud Firestore with the player name you chose in the Game, the hero and the hall of that score, the game version and the time, and your place, name and score are shown to all players. Your email address and account details are never shown. Guests do not appear on leaderboards. Deleting your account removes your leaderboard entries with it.</p>',
        '<h2>3. Advertising</h2><p>This version of the Game shows no third-party advertisements and contains no analytics, tracking or advertising identifiers. Some screens offer optional "watch an ad" rewards; in this version they show an in-game placeholder and send nothing anywhere.</p><p>If we add an advertising network (such as Google AdMob), this policy will be updated before it goes live, and where the law requires it you will be asked for consent to personalised advertising.</p>',
        '<h2>4. In-app purchases</h2><p>The Game may offer optional in-app purchases. They are processed by Google Play Billing on Android and by the App Store on iOS. We never receive or store your card number or other payment credentials. The Game receives only the confirmation needed to know that a purchase was completed and which in-game item to grant, and records the item in your save.</p>',
        '<h2>5. Store ratings</h2><p>The app may show the store\'s own rating window after a victory. Your rating and review go to Google Play or the App Store under their policies; we do not receive them through the Game.</p>',
        '<h2>6. Third-party services</h2><p>The Game uses these services, which process information under their own policies:</p><ul>' +
          '<li><b>Firebase Authentication</b> (Google): sign-in with email or Google. <a href="https://firebase.google.com/support/privacy" target="_blank" rel="noopener">Firebase privacy information</a></li>' +
          '<li><b>Google Cloud Firestore</b> (Firebase): storage of the cloud save and of leaderboard entries.</li>' +
          '<li><b>Firebase Hosting</b> (Google): delivery of the browser version, and of the live settings every copy of the Game reads (events, game versions and the current date).</li>' +
          '<li><b>Google Sign-In</b>: signing in with a Google account, if you choose it. <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a></li>' +
          '<li><b>Google Play</b> and the <b>Apple App Store</b>: distribution, in-app purchases and ratings. <a href="https://www.apple.com/legal/privacy/" target="_blank" rel="noopener">Apple Privacy Policy</a></li></ul>',
        '<h2>7. Device permissions</h2><p>The Game does not request access to your camera, microphone, location, contacts, photos or files. It uses the internet only for signing in, the cloud save, leaderboards and reading the live settings (the game itself can be played offline), and may use vibration for feedback, which you can turn off in Settings.</p>',
        '<h2>8. Children\'s privacy</h2><p>The Game is not directed at children under 13, and we do not knowingly collect their personal data. Where local law sets a higher age for consenting to online services, a parent or guardian must agree before a younger player signs in. A parent or guardian who believes a child has given us personal data can contact us and we will delete it.</p>',
        '<h2>9. How we use information</h2><p>We use the information described above only to:</p><ul><li>provide and operate the Game;</li><li>sign players in and keep their accounts secure;</li><li>save, restore and synchronise game progress between devices;</li><li>grant in-game items that were purchased;</li><li>prevent fraud, cheating and misuse of the service;</li><li>answer support and privacy requests; and</li><li>comply with legal obligations.</li></ul><p>We do not sell personal data, do not use it for advertising and do not share it with anyone other than the services listed above.</p>',
        '<h2>10. Data retention and account deletion</h2><div class="box"><b>Delete your account and data at any time</b><br>In the Game: <b>Settings → Account &amp; cloud save → Delete account</b>. Your account, its cloud save and its leaderboard entries are deleted at once. You can also ask us to do it by writing to ' + f.email + '.<br>Guest progress on this device: <b>Settings → Reset progress</b>, or uninstall the app or clear the browser data.</div>' +
          '<p>Your account and cloud save are kept until you delete them. Copies in Google\'s backups are removed within the periods Google applies. If we must keep a record for legal reasons (for example, of a disputed purchase), we keep only what is needed and only as long as needed.</p>',
        '<h2>11. Your privacy rights</h2><p>Under data protection law (such as the EU General Data Protection Regulation), you have the right to:</p><ul><li>know how your personal data is processed and get access to it;</li><li>have inaccurate data corrected;</li><li>have your data deleted;</li><li>restrict or object to certain processing;</li><li>receive your data in a portable form (in the Game: <b>Settings → Transfer progress</b>);</li><li>withdraw consent where processing is based on consent; and</li><li>lodge a complaint with a data protection authority; in Bulgaria this is the Commission for Personal Data Protection (<a href="https://www.cpdp.bg" target="_blank" rel="noopener">cpdp.bg</a>).</li></ul><p>To make a request, write to ' + f.email + '. We answer within one month.</p>',
        '<h2>12. Security</h2><p>Data travels over encrypted connections. Access to each cloud save is limited to its owner by the database rules, and sign-in is handled by an established provider. No method of transmission or storage is completely secure, but we take reasonable steps to protect your information.</p>',
        '<h2>13. International processing</h2><p>Google may process data on servers outside the European Economic Area. Such transfers are protected by the European Commission\'s standard contractual clauses and the other safeguards described in Google\'s terms.</p>',
        '<h2>14. Legal bases for processing</h2><ul><li><b>Performance of a contract:</b> signing you in, keeping your cloud save and granting purchased items, when you ask for them.</li><li><b>Legitimate interests:</b> security, fraud and cheating prevention, and keeping the service running.</li><li><b>Legal obligations:</b> keeping records required by law, for example for purchases.</li><li><b>Consent:</b> only if a feature ever needs it (such as personalised advertising); you can withdraw it at any time.</li></ul>',
        '<h2>15. Changes to this policy</h2><p>We will update this policy when the Game, its features or the services it uses change. The latest version is always published on this page with its date, and important changes are announced in the Game.</p>',
        '<h2>16. Contact us</h2><div class="box">For questions, requests about your data or support:<br><b>Developer:</b> ' + f.name + '<br>' + (f.eik ? '<b>UIC:</b> ' + f.eik + '<br>' : '') + (f.addr ? '<b>Address:</b> ' + f.addr + '<br>' : '') + '<b>Game:</b> Dreadhollow<br><b>Email:</b> ' + f.email + '</div>',
      ]; } },
      terms: { title: 'Terms of Service', body: function (f) { return [
        '<p>These terms are an agreement between you and ' + f.owner + ' ("we") about your use of Dreadhollow (the game, in its app and browser versions). By playing, you accept them. If you do not agree, please do not play. Contact: ' + f.email + '.</p>',
        '<h2>1. Playing the game</h2><p>We give you a personal, non-exclusive, non-transferable and revocable right to play the game for your own entertainment. The game, its art, music, code and names belong to us or our licensors; these terms give you no other rights to them.</p>',
        '<h2>2. Guest play and accounts</h2><p>You can play as a guest; your progress then stays on your device. You can also sign in with Google or an email address to keep your progress in the cloud. Keep your sign-in details to yourself; you are responsible for what is done with your account. You can delete your account at any time in the game (Settings → Account &amp; cloud save).</p>',
        '<h2>3. Virtual items and purchases</h2><p>Gold, gems, torches, chests, heroes and other items in the game are a licence to use them inside the game. They have no value outside it and cannot be exchanged for money or transferred to others.</p>' +
          '<p>Purchases are made through Google Play or the App Store and follow their terms and refund policies. Except where the law gives you a right to a refund, purchases are final. Items bought are delivered to your game at once; if one does not arrive, contact us and we will put it right. By buying, you ask for the item to be delivered immediately and accept that the right of withdrawal ends once it has been delivered, as far as the law allows.</p>',
        '<h2>4. Advertising</h2><p>The game may offer optional advertisements in exchange for rewards, and may show short advertisements between battles unless you have bought their removal. Rewards from an advertisement are given only once it has been watched.</p>',
        '<h2>5. Fair play</h2><p>Please do not cheat, exploit bugs, modify the game or its saves to gain items, interfere with the service or other players, or use the game for anything unlawful. If you do, we may reset the affected progress or close the account.</p>',
        '<h2>6. Changes and availability</h2><p>We keep improving the game, so content, balance and features may change. We do our best to keep the cloud save running, but we cannot promise that the service will always be available or free of errors. We may end the game or its online features with reasonable notice in the game.</p>',
        '<h2>7. Liability</h2><p>The game is provided as it is. As far as the law allows, we are not liable for indirect losses, or for the loss of progress caused by events outside our control. Nothing in these terms limits rights you have as a consumer that cannot be limited by contract.</p>',
        '<h2>8. Personal data</h2><p>How we handle personal data is explained in the <a href="?doc=privacy&amp;lang=en">Privacy Policy</a>.</p>',
        '<h2>9. Law and disputes</h2><p>These terms are governed by the law of the Republic of Bulgaria. If you are a consumer, you keep the protection of the mandatory rules of the country where you live, and you may bring a claim there. You can also use the European Commission\'s Online Dispute Resolution platform.</p>',
        '<h2>10. Changes to these terms</h2><p>If these terms change, the new version is published here with a new date and announced in the game. Continuing to play after that means you accept the new version.</p>',
      ]; } },
    },
    bg: {
      privacy: { title: 'Политика за поверителност', body: function (f) { return [
        '<p>Тази политика за поверителност се отнася за играта <b>Dreadhollow</b> („Играта“), като мобилно приложение и в браузъра, разработена и издадена от ' + f.owner + ' („ние“). Тя обяснява каква информация се обработва, докато играеш, как се използва, кои външни услуги участват и какви са правата ти. Ние сме администратор на личните ти данни.</p>',
        '<h2>1. Акаунти и данни на играча</h2><p>Dreadhollow може да се играе без акаунт. Входът е по желание и служи за едно: да пазиш прогреса си в облака, за да го възстановиш или да продължиш на друго устройство.</p><ul>' +
          '<li><b>Игра като гост:</b> прогресът, настройките и покупките ти се пазят на устройството (в паметта на приложението или в локалното хранилище на браузъра). Когато се използва сървърът на играта, всеки гост получава и анонимен акаунт (Firebase Authentication, без име, имейл или данни за връзка) и прогресът се пази на сървъра на играта под него, за да могат валутите и наградите да се проверяват там и никой да не ги подправя. Ако по-късно влезеш с Google или имейл, същият прогрес остава.</li>' +
          '<li><b>Вход:</b> ако влезеш, Firebase Authentication (Google) обработва имейл адреса ти, а ако влизаш с Google, и идентификатора на Google акаунта ти и свързаното с него име, дали имейлът е потвърден и кои начини за вход ползваш.</li>' +
          '<li><b>Облачен запис:</b> за влезлите играчи записът се пази в Google Cloud Firestore. Той съдържа данни от играта като ниво, герои, екипировка, валути в играта, отключени предмети, подвизи, статистика и настройки, кратко резюме на прогреса, вида устройство, от което е дошъл (например „Android · приложение“), и кога е записан.</li>' +
          '<li><b>Данни на устройството:</b> Играта пази записа и настройките си на устройството ти, а версията в браузъра пази копие на файловете на играта, за да работи без връзка.</li></ul>',
        '<h2>2. Класации; без мултиплейър и чат</h2><p>Dreadhollow е игра за един играч, без мултиплейър и без чат или друга връзка между играчи.</p><p>Играта може да има публични класации (например за най-много убити врагове в една битка този месец). Участват само влезлите играчи. За всяка класация резултатът ти се пази в Google Cloud Firestore заедно с името на играча, което си избрал в Играта, героя и залата на резултата, версията на играта и часа, а мястото, името и резултатът ти се виждат от всички играчи. Имейлът и данните на акаунта ти никога не се показват. Гостите не участват в класациите. Изтриването на акаунта премахва и записите ти в класациите.</p>',
        '<h2>3. Реклама</h2><p>Тази версия на Играта не показва реклами от трети страни и не съдържа инструменти за анализ, проследяване или рекламни идентификатори. Някои екрани предлагат награди срещу „гледане на реклама“ по желание; в тази версия те показват временна заставка в играта и не изпращат нищо никъде.</p><p>Ако добавим рекламна мрежа (например Google AdMob), ще обновим тази политика, преди тя да заработи, и където законът го изисква, ще поискаме съгласието ти за персонализирана реклама.</p>',
        '<h2>4. Покупки в приложението</h2><p>Играта може да предлага покупки по желание. Те се обработват от Google Play Billing на Android и от App Store на iOS. Никога не получаваме и не пазим номера на картата ти или други данни за плащане. Играта получава само потвърждението, нужно да разбере, че покупката е завършена и кой предмет да даде, и го отбелязва в записа ти.</p>',
        '<h2>5. Оценки в магазина</h2><p>Приложението може да покаже прозореца за оценка на магазина след победа. Оценката и отзивът ти отиват в Google Play или App Store по техните правила; ние не ги получаваме чрез Играта.</p>',
        '<h2>6. Външни услуги</h2><p>Играта ползва тези услуги, които обработват информация по собствените си правила:</p><ul>' +
          '<li><b>Firebase Authentication</b> (Google): вход с имейл или Google. <a href="https://firebase.google.com/support/privacy" target="_blank" rel="noopener">Поверителност при Firebase</a></li>' +
          '<li><b>Google Cloud Firestore</b> (Firebase): съхранение на облачния запис и на записите в класациите.</li>' +
          '<li><b>Firebase Hosting</b> (Google): доставяне на версията в браузъра и на настройките, които всяко копие на Играта чете (евенти, версии на играта и текущата дата).</li>' +
          '<li><b>Вход с Google</b>: вход с Google акаунт, ако го избереш. <a href="https://policies.google.com/privacy?hl=bg" target="_blank" rel="noopener">Политика за поверителност на Google</a></li>' +
          '<li><b>Google Play</b> и <b>Apple App Store</b>: разпространение, покупки в приложението и оценки. <a href="https://www.apple.com/legal/privacy/" target="_blank" rel="noopener">Политика за поверителност на Apple</a></li></ul>',
        '<h2>7. Разрешения на устройството</h2><p>Играта не иска достъп до камерата, микрофона, местоположението, контактите, снимките или файловете ти. Ползва интернет само за вход, облачен запис, класации и четене на настройките (самата игра може да се играе без връзка) и може да ползва вибрация, която можеш да изключиш от Настройките.</p>',
        '<h2>8. Деца</h2><p>Играта не е предназначена за деца под 13 години и не събираме съзнателно техни лични данни. В България съгласие за онлайн услуги може да се дава самостоятелно от 14 години; за по-малки играчи родител или настойник трябва да се съгласи, преди да влязат в акаунт. Родител или настойник, който смята, че дете ни е дало лични данни, може да се свърже с нас и ще ги изтрием.</p>',
        '<h2>9. За какво ползваме информацията</h2><p>Ползваме описаната информация само за да:</p><ul><li>предоставяме Играта и да я поддържаме;</li><li>вписваме играчите и пазим акаунтите им;</li><li>записваме, възстановяваме и синхронизираме прогреса между устройствата;</li><li>даваме купените предмети в играта;</li><li>предотвратяваме измами, мамене и злоупотреби;</li><li>отговаряме на запитвания за поддръжка и за лични данни; и</li><li>изпълняваме законовите си задължения.</li></ul><p>Не продаваме лични данни, не ги ползваме за реклама и не ги споделяме с никого освен с изброените по-горе услуги.</p>',
        '<h2>10. Съхранение и изтриване на акаунта</h2><div class="box"><b>Изтрий акаунта и данните си по всяко време</b><br>В Играта: <b>Настройки → Акаунт и облачен запис → Изтрий акаунта</b>. Акаунтът, облачният му запис и записите му в класациите се изтриват веднага. Можеш и да ни помолиш да го направим на ' + f.email + '.<br>Прогрес като гост на това устройство: <b>Настройки → Изтрий прогреса</b>, или изтрий приложението или данните на браузъра.</div>' +
          '<p>Акаунтът и облачният ти запис се пазят, докато не ги изтриеш. Копията в резервните копия на Google се премахват в сроковете, които Google прилага. Ако законът ни задължава да пазим някакъв запис (например за оспорена покупка), пазим само нужното и само колкото е нужно.</p>',
        '<h2>11. Твоите права</h2><p>Според законите за защита на данните (например Общия регламент на ЕС) имаш право:</p><ul><li>да знаеш как се обработват личните ти данни и да получиш достъп до тях;</li><li>да поправиш неточни данни;</li><li>да поискаш изтриването им;</li><li>да ограничиш или да възразиш срещу някои видове обработване;</li><li>да получиш данните си в преносим вид (в Играта: <b>Настройки → Пренос на прогреса</b>);</li><li>да оттеглиш съгласие, когато обработването се основава на съгласие; и</li><li>да подадеш жалба до надзорен орган; в България това е Комисията за защита на личните данни (<a href="https://www.cpdp.bg" target="_blank" rel="noopener">cpdp.bg</a>).</li></ul><p>За искане ни пиши на ' + f.email + '. Отговаряме до един месец.</p>',
        '<h2>12. Сигурност</h2><p>Данните се пренасят по криптирани връзки. Достъпът до всеки облачен запис е ограничен само до собственика му чрез правилата на базата данни, а входът се обслужва от утвърден доставчик. Никой начин за пренос или съхранение не е напълно сигурен, но вземаме разумни мерки да пазим информацията ти.</p>',
        '<h2>13. Обработване извън ЕС</h2><p>Google може да обработва данни на сървъри извън Европейското икономическо пространство. Тези прехвърляния са защитени със стандартните договорни клаузи на Европейската комисия и другите гаранции в условията на Google.</p>',
        '<h2>14. Правни основания</h2><ul><li><b>Изпълнение на договор:</b> вписване, пазене на облачния запис и даване на купените предмети, когато ги поискаш.</li><li><b>Легитимен интерес:</b> сигурност, предотвратяване на измами и мамене и поддържане на услугата.</li><li><b>Законово задължение:</b> пазене на записи, които законът изисква, например за покупки.</li><li><b>Съгласие:</b> само ако някоя възможност го изисква (например персонализирана реклама); можеш да го оттеглиш по всяко време.</li></ul>',
        '<h2>15. Промени в политиката</h2><p>Ще обновяваме тази политика, когато Играта, възможностите ѝ или услугите, които ползва, се променят. Последната версия винаги е на тази страница с датата си, а важните промени се обявяват в Играта.</p>',
        '<h2>16. Връзка с нас</h2><div class="box">За въпроси, искания за данните ти или поддръжка:<br><b>Разработчик:</b> ' + f.name + '<br>' + (f.eik ? '<b>ЕИК:</b> ' + f.eik + '<br>' : '') + (f.addr ? '<b>Адрес:</b> ' + f.addr + '<br>' : '') + '<b>Игра:</b> Dreadhollow<br><b>Имейл:</b> ' + f.email + '</div>',
      ]; } },
      terms: { title: 'Условия за ползване', body: function (f) { return [
        '<p>Тези условия са споразумение между теб и ' + f.owner + ' („ние“) за ползването на Dreadhollow (играта, като приложение и в браузъра). Като играеш, ги приемаш. Ако не си съгласен, моля, не играй. Връзка: ' + f.email + '.</p>',
        '<h2>1. Игра</h2><p>Даваме ти лично, неизключително, непрехвърлимо и отменимо право да играеш играта за собствено забавление. Играта, графиката, музиката, кодът и имената ѝ принадлежат на нас или на нашите лицензодатели; тези условия не ти дават други права върху тях.</p>',
        '<h2>2. Игра като гост и акаунти</h2><p>Можеш да играеш като гост; тогава прогресът ти остава на устройството. Можеш и да влезеш с Google или с имейл, за да пазиш прогреса си в облака. Пази данните си за вход само за себе си; отговаряш за това, което се прави с акаунта ти. Можеш да изтриеш акаунта си по всяко време от играта (Настройки → Акаунт и облачен запис).</p>',
        '<h2>3. Виртуални предмети и покупки</h2><p>Златото, скъпоценните камъни, факлите, сандъците, героите и другите предмети в играта са право да ги ползваш в нея. Нямат стойност извън играта и не могат да се обменят срещу пари или да се прехвърлят на други.</p>' +
          '<p>Покупките се правят чрез Google Play или App Store и следват техните условия и правила за възстановяване на суми. Освен когато законът ти дава право на възстановяване, покупките са окончателни. Купеното се доставя в играта веднага; ако нещо не пристигне, пиши ни и ще го оправим. С покупката искаш предметът да бъде доставен веднага и приемаш, че правото ти на отказ отпада след доставката, доколкото законът го позволява.</p>',
        '<h2>4. Реклама</h2><p>Играта може да предлага реклами по желание срещу награда и да показва кратки реклами между битките, освен ако не си купил премахването им. Наградата от реклама се дава само след като тя е изгледана.</p>',
        '<h2>5. Честна игра</h2><p>Моля, не мами, не използвай грешки в играта, не променяй играта или записите ѝ, за да получиш предмети, не пречи на услугата или на други играчи и не използвай играта за нищо незаконно. Ако го направиш, можем да нулираме засегнатия прогрес или да закрием акаунта.</p>',
        '<h2>6. Промени и достъпност</h2><p>Продължаваме да подобряваме играта, затова съдържанието, балансът и възможностите може да се променят. Правим всичко възможно облачният запис да работи, но не можем да обещаем, че услугата винаги ще е достъпна или без грешки. Можем да прекратим играта или онлайн функциите ѝ с разумно предизвестие в играта.</p>',
        '<h2>7. Отговорност</h2><p>Играта се предоставя такава, каквато е. Доколкото законът позволява, не отговаряме за косвени вреди или за загуба на прогрес поради събития извън нашия контрол. Нищо в тези условия не ограничава правата ти като потребител, които не могат да се ограничат с договор.</p>',
        '<h2>8. Лични данни</h2><p>Как обработваме личните данни е обяснено в <a href="?doc=privacy&amp;lang=bg">Политиката за поверителност</a>.</p>',
        '<h2>9. Приложимо право и спорове</h2><p>За тези условия се прилага правото на Република България. Ако си потребител, запазваш защитата на задължителните правила на държавата, в която живееш, и можеш да предявиш иск там. Можеш да ползваш и платформата на Европейската комисия за онлайн решаване на спорове.</p>',
        '<h2>10. Промени в условията</h2><p>Ако условията се променят, новата версия се публикува тук с нова дата и се обявява в играта. Ако продължиш да играеш след това, приемаш новата версия.</p>',
      ]; } },
    },
  };
  var UI = { en: { privacy: 'Privacy', terms: 'Terms', game: 'Game', updated: 'Effective date', dev: 'Developer', back: '← Back to Dreadhollow' },
    bg: { privacy: 'Поверителност', terms: 'Условия', game: 'Игра', updated: 'В сила от', dev: 'Разработчик', back: '← Към Dreadhollow' } };

    var D = DOCS[state.lang][state.doc], f = fill(state.lang), u = UI[state.lang];
    document.documentElement.lang = state.lang;
    document.title = 'Dreadhollow · ' + D.title;
    document.getElementById('back').textContent = u.back;

    var nav = document.getElementById('nav');
    nav.innerHTML = '';
    [['doc', 'privacy', u.privacy], ['doc', 'terms', u.terms], ['lang', 'en', 'English'], ['lang', 'bg', 'Български']].forEach(function (b) {
      var btn = document.createElement('button');
      btn.textContent = b[2]; if (state[b[0]] === b[1]) btn.className = 'on';
      btn.onclick = function () { state[b[0]] = b[1]; history.replaceState(null, '', '?doc=' + state.doc + '&lang=' + state.lang + (q.get('embed') ? '&embed=1' : '')); render(); window.scrollTo(0, 0); };
      nav.appendChild(btn);
    });
    // links between the two documents stay in the same view
    Array.prototype.forEach.call(document.querySelectorAll('#doc a[href^="?doc="]'), function (a) {
      a.onclick = function (e) { e.preventDefault(); state.doc = new URLSearchParams(a.getAttribute('href')).get('doc'); render(); window.scrollTo(0, 0); };
    });
  }
  render();
})();
